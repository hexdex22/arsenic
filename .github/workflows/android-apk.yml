name: Build Android APK

on:
  push:
    branches: [claude/gps-data-display-app-4otv2o, main]
    paths:
      - "gps_display_app/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: gps_display_app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gps-live-debug-apk
          path: gps_display_app/android/app/build/outputs/apk/debug/app-debug.apk
